name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build Jellyfin.AutoOrganizer.sln -c Release
      - run: dotnet test Jellyfin.AutoOrganizer.sln -c Release --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/config-page.test.cjs
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AutoOrganizer-${{ matrix.os }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
